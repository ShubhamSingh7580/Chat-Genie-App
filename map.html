<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Map</title>
    <link rel="icon" type="image/png" href="images/appicon2.png" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        overflow-x: scroll;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="navbar" id="navMenu">
        <a href="features.html">App Features</a>
        <a href="Chatbot.html">Chatbot</a>
        <a href="list.html">List of Qs</a>
        <a href="courseinfo.html">Course Info</a>
        <a href="facultyinfo.html">Faculty Info</a>
        <a href="about.html">About College</a>
        <a href="contact.html">ContactUs</a>
      </div>

      <div class="nav-menu-btn">
        <i
          id="Menu"
          class="bx bx-menu"
          onclick="myMenuFunction()"
          title="Menu"
        ></i>
        <i id="Cross" class="bx bxs-x-circle" title="Close"></i>
      </div>
      <h2 class="m-h">Campus Map</h2>
    </header>

    <div class="logo-section2">
      <img src="images/bbau-logo.jpg" alt="BBAU Logo" class="college-logo" />
      <h1 class="college-name">Babasaheb Bhimrao Ambedkar University,<br /></h1>
      <h2 class="college-Q">A Central University <br /></h2>
      <h1 class="college-name">Satellite Centre, Amethi- 227413</h1>
    </div>
    <div class="divider"></div>

    <div class="map-heading">
      <h1>BBAU Satellite Center Amethi - Campus Map</h1>
    </div>
    <div class="divider"></div>

    <div class="map-container">
      <iframe
        src="https://www.google.com/maps/d/u/0/embed?mid=1q-zKjqkG8ey67SSViHPcYDBGWS30HVU&ehbc=2E312F&noprof=1"
        title="BBAU Satellite Centre Amethi Campus Map"
        allowfullscreen
      ></iframe>
    </div>
    <div class="divider"></div>

    <script>
      function myMenuFunction() {
        var navMenu = document.getElementById("navMenu");
        var navMenuBtn = document.querySelector(".nav-menu-btn");
        var menuBtn = document.getElementById("Menu");
        var crossBtn = document.getElementById("Cross");

        if (navMenu.className === "navbar") {
          navMenu.className += " responsive";
          navMenuBtn.classList.add("active");
          menuBtn.style.display = "none";
          crossBtn.style.display = "flex";
          document.addEventListener("click", closeMenuOnClickOutside);
        } else {
          navMenu.className = "navbar";
          navMenuBtn.classList.remove("active");
          crossBtn.style.display = "none";
          menuBtn.style.display = "flex";
          document.removeEventListener("click", closeMenuOnClickOutside);
        }
      }
      function closeMenuOnClickOutside(event) {
        var navMenu = document.getElementById("navMenu");
        var navMenuBtn = document.querySelector(".nav-menu-btn");
        var menuBtn = document.getElementById("Menu");
        var crossBtn = document.getElementById("Cross");

        if (
          !navMenu.contains(event.target) &&
          !navMenuBtn.contains(event.target)
        ) {
          navMenu.className = "navbar";
          menuBtn.style.display = "flex";
          crossBtn.style.display = "none";
          document.removeEventListener("click", closeMenuOnClickOutside);
        }
      }
      document.getElementById("Cross").addEventListener("click", function () {
        var navMenu = document.getElementById("navMenu");
        var navMenuBtn = document.querySelector(".nav-menu-btn");
        var menuBtn = document.getElementById("Menu");
        var crossBtn = document.getElementById("Cross");

        navMenu.className = "navbar";
        menuBtn.style.display = "flex";
        crossBtn.style.display = "none";
        navMenuBtn.classList.remove("active");
        document.removeEventListener("click", closeMenuOnClickOutside);
      });
    </script>
  </body>
</html>
